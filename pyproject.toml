[project]
name = "funcsim-agent"
version = "0.1.0"
description = "Interpretable multi-agent binary function similarity verifier"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.2.0",
    "langchain>=1.0.0",
    "langchain-deepseek>=1.0.1",
    "langgraph>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
funcsim-agent = "enterprise_agent.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
