services:
  agent-sandbox:
    image: python:3.13-slim
    container_name: ${SANDBOX_CONTAINER_NAME:-agent_sandbox}
    command: ["sleep", "infinity"]
    working_dir: /workspace
    volumes:
      - ./src/enterprise_agent/agents/prompts:/input/prompts:ro
      - ./src/enterprise_agent/agents/skills/function-similarity:/input/skills:ro
      - ./src/enterprise_agent/agents/subagents:/input/subagents:ro
      - ./src/enterprise_agent/agents/tools:/input/tools:ro
      - ./experiments/skill_evolution/runs/default/error_analysis:/input/evolution:ro
      - ./data/sandbox/workspace:/workspace
      - ./data/sandbox/output:/output
